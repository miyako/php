name: macOS PHP build tools
description: Install build tools, not runtime dependency libraries.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        brew install autoconf automake bison cmake composer flex gperf libtool make nasm ninja pkgconf re2c xz
        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
